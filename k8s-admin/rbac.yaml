apiVersion: v1
kind: Namespace
metadata:
  name: devsecops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: devsecops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: devsecops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: devsecops
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: devsecops
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
